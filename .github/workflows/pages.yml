name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: browser-site
          path: dist-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  browsers:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: browser-site
          path: dist-pages
      - name: Install Browser Test Runtime
        run: |
          npm install --prefix /tmp/planner-browser --no-package-lock --no-save playwright@1.62.1
          /tmp/planner-browser/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Check Mobile Budget Journey and PDF
        run: node scripts/browser-check.cjs
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/planner-browser/node_modules/playwright
          PLANNER_BROWSER: ${{ matrix.browser }}
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence-${{ matrix.browser }}
          path: browser-evidence

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, browsers]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
